<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- OpenWorker Hub Icon: 白色圆底 + 深墨黑猫 + Teal 眼睛 -->
  
  <!-- 圆形底 - 白色 -->
  <circle cx="50" cy="50" r="50" fill="#ffffff"/>
  
  <!-- 左耳 - 深墨黑 -->
  <path d="M22 42 L32 18 L44 36 Z" fill="#0c1222"/>
  <!-- 右耳 -->
  <path d="M78 42 L68 18 L56 36 Z" fill="#0c1222"/>
  
  <!-- 猫头主体 - 深墨黑 -->
  <ellipse cx="50" cy="58" rx="34" ry="32" fill="#0c1222"/>
  
  <!-- 左眼 -->
  <circle cx="38" cy="54" r="4.5" fill="#12a3b0"/>
  <!-- 右眼 -->
  <circle cx="62" cy="54" r="4.5" fill="#12a3b0"/>
</svg>
